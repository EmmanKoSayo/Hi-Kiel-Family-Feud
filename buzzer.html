<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Feud Buzzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;800&family=Pacifico&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{--pk:#e83e7e;--pk2:#f4587a;--paper:#f1eee8;--teal:#0a7488;--rd:#e5303a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light}}
:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:max(8px,env(safe-area-inset-top,0px)) 12px max(8px,env(safe-area-inset-bottom,0px));background:var(--pk2);background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.6px);background-size:6px 6px;color:#fff;font-family:'Nunito',system-ui,sans-serif;font-weight:600;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.brand{text-align:center;font-weight:800;font-style:italic;font-size:1rem;margin:0 0 8px}
.card{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;background:var(--paper);color:var(--teal);border-top:6px dotted #cdc8c0;border-bottom:6px dotted #cdc8c0;box-shadow:0 6px 0 rgba(0,0,0,.14);padding:18px;display:flex;flex-direction:column;font-family:'Roboto Mono',ui-monospace,monospace;font-weight:700}
.hide{display:none!important}
section{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
h1{font-family:'Pacifico',cursive;font-weight:400;color:var(--pk);font-size:clamp(2.4rem,11vw,3.6rem);margin:0;line-height:1.2}
label{display:block;margin-bottom:6px}
input{width:100%;padding:12px;border-radius:6px;border:2px solid var(--teal);background:#fff;color:var(--teal);font:700 2rem 'Roboto Mono',ui-monospace,monospace;text-align:center;letter-spacing:.2em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
button{font:inherit;font-family:'Nunito',system-ui,sans-serif;font-weight:800;cursor:pointer;border:0;border-radius:999px;padding:14px 22px;background:var(--pk);color:#fff;box-shadow:0 4px 0 #b02a5c;font-size:1.1rem}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b02a5c}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button.teal{background:var(--teal);box-shadow:0 4px 0 #064f5d}
button.ghost{background:var(--paper);color:var(--teal);border:2px solid var(--teal);box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:.9rem;padding:8px 16px}
.team{width:100%;max-width:340px;padding:22px 16px;font-size:1.5rem;overflow:hidden;text-overflow:ellipsis}
.err{color:#d6283a;min-height:1.3em}
#who{font-size:1.05rem}
.big{width:min(78vw,44dvh);aspect-ratio:1;border-radius:50%;padding:0;border:0;font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(2rem,10vw,3.6rem);color:#fff;background:radial-gradient(circle,#f0404a 0 62%,#d92f3a 64% 100%);box-shadow:inset 0 -8px 14px rgba(0,0,0,.2),0 10px 0 #8f1620;touch-action:manipulation}
.big:active{transform:translateY(7px);box-shadow:inset 0 -8px 14px rgba(0,0,0,.2),0 3px 0 #8f1620}
.big.win{background:radial-gradient(circle,#37c98a 0 62%,#27a971 64% 100%);box-shadow:inset 0 -8px 14px rgba(0,0,0,.2),0 10px 0 #17744c}
.big.lose,.big:disabled:not(.win){background:radial-gradient(circle,#9aa0ab 0 62%,#858b97 64% 100%);box-shadow:inset 0 -8px 14px rgba(0,0,0,.2),0 10px 0 #5d6270;cursor:default}
.big:disabled:active{transform:none}
#msg{min-height:2.6em;font-size:1.05rem}
#stat{text-align:center;font-size:.8rem;margin-top:8px;opacity:.85}
</style>
</head>
<body>
<div class="brand">KLuster Official</div>
<main class="card">

<section id="join">
  <h1>Buzzer</h1>
  <div style="width:100%;max-width:340px">
    <label for="code">Room code from the host</label>
    <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCD">
  </div>
  <div class="err" id="err" role="alert"></div>
  <button id="go">Join game</button>
</section>

<section id="pick" class="hide">
  <h1>Pick your team</h1>
  <button class="team" id="t0"></button>
  <button class="team teal" id="t1"></button>
</section>

<section id="play" class="hide">
  <div id="who"></div>
  <button class="big" id="buzz" disabled>WAIT</button>
  <div id="msg"></div>
  <button class="ghost" id="sw">Switch team</button>
</section>

<div id="stat">Not connected</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var P=null,conn=null,team=null,code="",pending=false,wl=null;
var st={names:["Team 1","Team 2"],locked:null,live:false};
function view(id){["join","pick","play"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}
function setS(t){$("stat").textContent=t}
function err(t){$("err").textContent=t}
function keepAwake(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wl=w}).catch(function(){})}catch(e){}}
function render(){
  $("t0").textContent=st.names[0];$("t1").textContent=st.names[1];
  if(team===null) return;
  $("who").textContent="You are on: "+st.names[team];
  var b=$("buzz"),m=$("msg");
  b.className="big";
  if(!st.live){b.disabled=true;b.textContent="WAIT";m.textContent="Waiting for the host to start the game."}
  else if(st.locked===null){b.disabled=false;b.textContent="BUZZ!";m.textContent=pending?"Sent…":"Tap when you know the answer!"}
  else if(st.locked===team){b.className="big win";b.disabled=true;b.textContent="YOU’RE IN!";m.textContent="Your team buzzed first!"}
  else{b.className="big lose";b.disabled=true;b.textContent="LOCKED";m.textContent=st.names[st.locked]+" buzzed first."}
}
function join(){
  code=$("code").value.trim().toUpperCase();
  if(code.length<4){err("Type the 4-character room code.");return}
  err("");connect();
}
function connect(){
  setS("Connecting…");
  if(P){try{P.destroy()}catch(e){}}
  P=new Peer();
  P.on("open",function(){
    conn=P.connect("kfeud-"+code,{reliable:true});
    conn.on("open",function(){setS("Connected");keepAwake();view(team===null?"pick":"play");render()});
    conn.on("data",function(m){if(m&&m.t==="state"){st=m;pending=false;render()}});
    var lost=function(){setS("Connection lost. Reconnecting…");setTimeout(connect,2000)};
    conn.on("close",lost);conn.on("error",lost);
  });
  P.on("error",function(e){
    if(e.type==="peer-unavailable"){team=null;view("join");err("Room not found. Check the code with the host.");setS("Not connected");return}
    setS("Connection problem ("+e.type+"). Retrying…");setTimeout(connect,3000);
  });
}
function press(){
  var b=$("buzz");
  if(b.disabled||team===null) return;
  if(!conn||!conn.open){$("msg").textContent="Not connected. Wait a moment…";return}
  conn.send({t:"buzz",team:team});
  pending=true;
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  $("msg").textContent="Sent…";
}
function choose(t){team=t;view("play");render()}
$("go").onclick=join;
$("code").onkeydown=function(e){if(e.key==="Enter")join()};
$("t0").onclick=function(){choose(0)};
$("t1").onclick=function(){choose(1)};
$("sw").onclick=function(){team=null;view("pick");render()};
$("buzz").onpointerdown=function(e){e.preventDefault();press()};
$("buzz").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();press()}};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&team!==null)keepAwake()});
var h=location.hash.replace("#","").trim().toUpperCase();
if(h){$("code").value=h.slice(0,4);join()}
</script>
</body>
</html>
